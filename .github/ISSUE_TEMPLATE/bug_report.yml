name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not use this form — follow SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm start`
        2. Open http://localhost:4040
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output. Remove any private keys, tokens or wallet details first.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Node.js 22.11, Foxy Network 0.2.0"
    validations:
      required: true
